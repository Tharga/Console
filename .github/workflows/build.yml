name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  MAJOR_MINOR: '4.2'

permissions:
  contents: write
  pull-requests: write
  security-events: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Version is computed BEFORE the build so it can be passed as -p:Version.
      # Passing it only to `dotnet pack` sets PackageVersion alone, leaving
      # AssemblyVersion and FileVersion at their default 1.0.0.0 inside the
      # shipped assembly.
      - name: Compute version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "${MAJOR_MINOR}.*" --sort=-v:refname \
            | { grep -E "^${MAJOR_MINOR}\.[0-9]+$" || true; } \
            | head -1)

          if [ -z "$LATEST_TAG" ]; then
            PATCH=0
          else
            PATCH=$(echo "$LATEST_TAG" | sed "s/${MAJOR_MINOR}\.\([0-9]*\)/\1/")
            PATCH=$((PATCH + 1))
          fi

          VERSION="${MAJOR_MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION (previous: $LATEST_TAG)"

      - name: Compute pre-release version
        id: preversion
        if: github.ref != 'refs/heads/master'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRE_BASE="${VERSION}-pre"

          LATEST_PRE=$(git tag -l "${PRE_BASE}.*" --sort=-v:refname | head -1)

          if [ -z "$LATEST_PRE" ]; then
            COUNTER=1
          else
            COUNTER=$(echo "$LATEST_PRE" | sed "s/.*-pre\.\([0-9]*\)/\1/")
            COUNTER=$((COUNTER + 1))
          fi

          PRE_VERSION="${PRE_BASE}.${COUNTER}"
          echo "version=$PRE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed pre-release version: $PRE_VERSION"

      # Pull requests build the pre-release version, pushes to master the
      # stable one. One value drives build and pack so the assembly and the
      # package can never disagree.
      - name: Resolve build version
        id: buildversion
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="${{ steps.preversion.outputs.version }}"
          else
            VERSION="${{ steps.version.outputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building as: $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.buildversion.outputs.version }} 2>&1 | tee build.log

      - name: Check warnings
        run: |
          WARNING_COUNT=$(grep -c " warning " build.log || true)
          echo "Build warnings: $WARNING_COUNT"
          if [ "$WARNING_COUNT" -gt 15 ]; then
            echo "::error::Build has $WARNING_COUNT warnings (threshold: 15)"
            exit 1
          fi

      - name: Test
        run: dotnet test -c Release --no-build --results-directory ./coverage -- --filter-not-trait "Category=Database" --coverage --coverage-output-format cobertura --timeout 90s

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Pack
        shell: bash
        run: |
          dotnet pack Tharga.Console/Tharga.Console.csproj -c Release --no-build -o ./artifacts -p:Version=${{ steps.buildversion.outputs.version }}
          dotnet pack Tharga.Console.Standard/Tharga.Console.Standard.csproj -c Release --no-build -o ./artifacts -p:Version=${{ steps.buildversion.outputs.version }}
          dotnet pack Tharga.Console.Speech/Tharga.Console.Speech.csproj -c Release --no-build -o ./artifacts -p:Version=${{ steps.buildversion.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build for CodeQL
        run: dotnet build -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  release:
    needs: [build, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/

      - name: Compute version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "${MAJOR_MINOR}.*" --sort=-v:refname \
            | { grep -E "^${MAJOR_MINOR}\.[0-9]+$" || true; } \
            | head -1)

          if [ -z "$LATEST_TAG" ]; then
            PATCH=0
          else
            PATCH=$(echo "$LATEST_TAG" | sed "s/${MAJOR_MINOR}\.\([0-9]*\)/\1/")
            PATCH=$((PATCH + 1))
          fi

          VERSION="${MAJOR_MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Push to NuGet
        run: |
          # Only *.nupkg is globbed. Each matching package's sibling .snupkg is
          # uploaded automatically by dotnet nuget push, so symbols must NOT be
          # pushed explicitly or nuget.org sees a duplicate.
          ls -l ./artifacts/
          for pkg in ./artifacts/*.nupkg; do
            echo "Pushing $pkg..."
            # --skip-duplicate already makes a re-run of an existing version a
            # success, so a failure here is a real failure and must fail the job.
            dotnet nuget push "$pkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FLAG=""
          if [ -n "${{ steps.version.outputs.previous_tag }}" ]; then
            NOTES_FLAG="--notes-start-tag ${{ steps.version.outputs.previous_tag }}"
          fi
          gh release create "${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            $NOTES_FLAG \
            ./artifacts/*.nupkg

      - name: Comment released version on merged PR
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(echo "${{ github.event.head_commit.message }}" | grep -oP 'Merge pull request #\K\d+' | head -1)
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "Released as **v${{ steps.version.outputs.version }}** — https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}"
          else
            echo "No PR number found in commit message — skipping PR comment."
          fi

  prerelease:
    needs: [build, security]
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master' && github.event_name == 'pull_request'
    environment: prerelease

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/

      - name: Compute pre-release version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "${MAJOR_MINOR}.*" --sort=-v:refname \
            | { grep -E "^${MAJOR_MINOR}\.[0-9]+$" || true; } \
            | head -1)

          if [ -z "$LATEST_TAG" ]; then
            PATCH=0
          else
            PATCH=$(echo "$LATEST_TAG" | sed "s/${MAJOR_MINOR}\.\([0-9]*\)/\1/")
            PATCH=$((PATCH + 1))
          fi

          PRE_BASE="${MAJOR_MINOR}.${PATCH}-pre"
          LATEST_PRE=$(git tag -l "${PRE_BASE}.*" --sort=-v:refname | head -1)

          if [ -z "$LATEST_PRE" ]; then
            COUNTER=1
          else
            COUNTER=$(echo "$LATEST_PRE" | sed "s/.*-pre\.\([0-9]*\)/\1/")
            COUNTER=$((COUNTER + 1))
          fi

          VERSION="${PRE_BASE}.${COUNTER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push to NuGet
        run: |
          # Only *.nupkg is globbed. Each matching package's sibling .snupkg is
          # uploaded automatically by dotnet nuget push, so symbols must NOT be
          # pushed explicitly or nuget.org sees a duplicate.
          ls -l ./artifacts/
          for pkg in ./artifacts/*.nupkg; do
            echo "Pushing $pkg..."
            # --skip-duplicate already makes a re-run of an existing version a
            # success, so a failure here is a real failure and must fail the job.
            dotnet nuget push "$pkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Create GitHub Pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }} (pre-release)" \
            --notes "Pre-release from \`${{ github.head_ref }}\` branch." \
            --prerelease \
            ./artifacts/*.nupkg

  docs:
    needs: release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Restore
        run: dotnet restore

      - name: Build site
        run: docfx docs/docfx.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  docs-deploy:
    needs: docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
